name: PARC2026 CI

on:
  push:
    branches:
      - main
      - feat/parc2026-foundation
      - agent/add-colab-agent-cockpit
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  unit-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the OpenVLA-OFT reference line, 3.12 is what Colab now runs.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy Pillow PyYAML jsonschema pyarrow

      - name: Compile Python sources
        run: python -m compileall -q src frontend submission training scripts tests

      - name: Validate YAML and notebook JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          yaml_files = sorted(Path('.').glob('**/*.yaml')) + sorted(Path('.').glob('**/*.yml'))
          for path in yaml_files:
              if '.github/workflows' in str(path):
                  continue
              yaml.safe_load(path.read_text(encoding='utf-8'))
          notebooks = sorted(Path('notebooks').glob('*.ipynb'))
          for path in notebooks:
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload['nbformat'] == 4
              assert isinstance(payload['cells'], list) and payload['cells']
          print(f'validated {len(yaml_files)} YAML files and {len(notebooks)} notebooks')
          PY

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts training submission -type f -name '*.sh' -print0)

      - name: Validate submission dependency policy
        run: python scripts/validate_submission_requirements.py submission

      - name: Run unit and contract tests
        run: |
          pytest -q \
            tests/test_dataset_pipeline.py \
            tests/test_rlds_contract.py \
            tests/test_offline_runtime.py \
            tests/test_pre_gpu_readiness.py \
            tests/test_agent_cockpit.py \
            tests/test_agent_cockpit_data_and_policy.py \
            tests/test_autonomous_replay.py \
            tests/test_gpu_validation_and_libero.py

  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-frontend.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frontend.txt

      - name: Build Gradio application
        run: |
          python - <<'PY'
          from frontend.gradio_app import build_app
          app = build_app()
          assert app is not None
          print('Gradio Blocks build passed')
          PY

  synthetic-rlds-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Covers both TensorFlow lines declared in requirements-data.txt.
        python-version: ["3.10", "3.12"]
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: training/openvla_oft_a100/requirements-data.txt

      - name: Install RLDS conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/openvla_oft_a100/requirements-data.txt
          python -m pip install pytest numpy

      - name: Run synthetic LeRobot to RLDS E2E
        run: pytest -q tests/test_synthetic_rlds_e2e.py
